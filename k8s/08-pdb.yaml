apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: private-km
  namespace: private-km
  labels:
    app.kubernetes.io/name: private-km
spec:
  # Guarantee that at least 1 pod is available during voluntary disruptions
  # (node drain, cluster upgrade, rolling restarts).
  # With minReplicas=2 in the HPA, this means at most 1 pod can be taken
  # down at a time — rolling updates proceed one pod at a time.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: private-km
