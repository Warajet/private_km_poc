# ─────────────────────────────────────────────────────────────────────────────
# 03-secret.example.yaml — TEMPLATE ONLY
#
# DO NOT commit real secrets to git. Use the kubectl commands below to create
# the secrets directly from your secure credential store, or integrate with
# Huawei Cloud DEW / CSMS via the CSI driver.
#
# Create app-secrets:
#   kubectl create secret generic app-secrets \
#     --namespace=private-km \
#     --from-literal=DATABASE_URL="postgresql://USER:PASS@RDS_PRIVATE_IP:5432/private_km" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# Create gcp-service-account (GCP SA key for Vertex AI):
#   kubectl create secret generic gcp-service-account \
#     --namespace=private-km \
#     --from-file=key.json=./gcp-sa-key.json
#
# The values below are PLACEHOLDERS — they are never read by kubectl because
# this file is never applied. It exists only as documentation.
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: private-km
  labels:
    app.kubernetes.io/name: private-km
type: Opaque
stringData:
  # postgresql://USER:PASSWORD@PRIVATE_IP:5432/private_km
  DATABASE_URL: "REPLACE_ME"
  # openssl rand -hex 32
  JWT_SECRET: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: gcp-service-account
  namespace: private-km
  labels:
    app.kubernetes.io/name: private-km
type: Opaque
# The key.json file content goes here (base64-encoded in real usage)
# kubectl create secret generic gcp-service-account --from-file=key.json=./key.json
stringData:
  key.json: "REPLACE_ME_WITH_GCP_SA_JSON"
